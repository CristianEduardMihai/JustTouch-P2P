version: '3.8'

services:
  justtouch-server:
    build: .
    container_name: justtouch-server
    restart: unless-stopped
    ports:
      - "6609:6609"
    environment:
      - PORT=6609
      - NODE_ENV=production
      - ALLOWED_ORIGINS=https://justtouch.cristianmihai.cc
      - TRUST_PROXY=true

